# Packages (eager and lazy alike) are shim files in ../../.mysh/bin — no [tools]
# table here; eagerness is the `# mysh: eager` marker inside a shim (see
# docs/adr/0007 in the mysh repo). This file only carries mise settings/env.
# ponytail: setting keys below match mise's docs as of this writing — mise's
# settings surface has moved before; re-check `mise settings ls` if one of
# these no longer applies.
[env.UV_PYTHON]
tools = true
value = "{% if tools.python is defined %}{{ tools.python.path }}{% endif %}"

[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["python"]

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = "source"
