# [tools] here declares eager packages (installed during `apply`, exposed on PATH via
# mise's own shim mechanism); lazy packages are real shim files in ../../.mysh/bin
# instead (see docs/adr/0006 in the mysh repo).
# ponytail: setting keys below match mise's docs as of this writing — mise's
# settings surface has moved before; re-check `mise settings ls` if one of
# these no longer applies.
[env.UV_PYTHON]
tools = true
value = "{% if tools.python is defined %}{{ tools.python.path }}{% endif %}"

[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["python", "terraform"]

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = "source"

[tools]
"aqua:fish-shell/fish-shell" = "latest"
starship = "latest"
atuin = "latest"
zoxide = "latest"
direnv = "latest"
fzf = "latest"
zellij = "latest"
gh = "latest"
eza = "latest"
