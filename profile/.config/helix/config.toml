theme = "catppuccin_mocha"

[editor]
line-number = "relative"
auto-pairs = true
true-color = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = ["version-control"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[editor.soft-wrap]
enable = true
