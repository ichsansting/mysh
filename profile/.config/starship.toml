format = "$username$hostname$directory$git_branch$git_status${custom.mysh}$rust$python$nodejs$cmd_duration$line_break$character"
right_format = "$aws"
palette = "catppuccin_mocha"

# The granted-assumed profile, right side. Hidden when nothing is assumed.
[aws]
format = '[$profile]($style)'
style = "bold sky"

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"

[cmd_duration]
min_time = 2000
style = "bold yellow"

# One glyph for `mysh diff --quick`'s drift: ⇡ save-needed (Target drift or
# ahead of remote), ⇣ pull-needed (behind remote), ⇕ diverged. Empty output on
# clean, so starship hides the module entirely — same as $git_status.
[custom.mysh]
command = '''mysh diff --quick 2>/dev/null | awk -F'\t' '
$2 == "diverged" { d=1 }
$2 == "target" || $2 == "ahead" { s=1 }
$2 == "behind" { p=1 }
END { if (d) printf "⇕"; else if (s) printf "⇡"; else if (p) printf "⇣" }
'
'''
shell = ["sh"]
when = true
style = "bold red"

[directory]
style = "bold lavender"
truncate_to_repo = false
truncation_length = 4

[git_branch]
style = "bold mauve"
symbol = " "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
deleted = "✘"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!"
staged = "+"
style = "bold red"
untracked = "?"

[nodejs]
detect_files = ["package.json", ".nvmrc", ".node-version"]
style = "bold green"
symbol = " "

[palettes.catppuccin_mocha]
base = "#1e1e2e"
blue = "#89b4fa"
crust = "#11111b"
flamingo = "#f2cdcd"
green = "#a6e3a1"
lavender = "#b4befe"
mantle = "#181825"
maroon = "#eba0ac"
mauve = "#cba6f7"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
peach = "#fab387"
pink = "#f5c2e7"
red = "#f38ba8"
rosewater = "#f5e0dc"
sapphire = "#74c7ec"
sky = "#89dceb"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
teal = "#94e2d5"
text = "#cdd6f4"
yellow = "#f9e2af"

[python]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]
style = "bold yellow"
symbol = " "

[rust]
detect_files = ["Cargo.toml"]
style = "bold peach"
symbol = " "
