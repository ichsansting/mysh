format = "$username$hostname$directory$git_branch$git_status$nix_shell$rust$python$nodejs$cmd_duration$line_break$character"
palette = "catppuccin_mocha"

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"

[cmd_duration]
min_time = 2000
style = "bold yellow"

[directory]
style = "bold lavender"
truncate_to_repo = false
truncation_length = 4

[git_branch]
style = "bold mauve"
symbol = " "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
deleted = "✘"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!"
staged = "+"
style = "bold red"
untracked = "?"

[nix_shell]
format = "[$symbol$state]($style) "
style = "bold blue"
symbol = " "

[nodejs]
detect_files = ["package.json", ".nvmrc", ".node-version"]
style = "bold green"
symbol = " "

[palettes.catppuccin_mocha]
base = "#1e1e2e"
blue = "#89b4fa"
crust = "#11111b"
flamingo = "#f2cdcd"
green = "#a6e3a1"
lavender = "#b4befe"
mantle = "#181825"
maroon = "#eba0ac"
mauve = "#cba6f7"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
peach = "#fab387"
pink = "#f5c2e7"
red = "#f38ba8"
rosewater = "#f5e0dc"
sapphire = "#74c7ec"
sky = "#89dceb"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
teal = "#94e2d5"
text = "#cdd6f4"
yellow = "#f9e2af"

[python]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]
style = "bold yellow"
symbol = " "

[rust]
detect_files = ["Cargo.toml"]
style = "bold peach"
symbol = " "
