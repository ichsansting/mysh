[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "pull-request-number", "branch-changes", "run-state", "approval-mode", "context-used", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens", "thread-credits", "estimated-thread-cost", "fast-mode"]
status_line_use_colors = true

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins."ponytail@ponytail"]
enabled = true
